<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LaneSight Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: app shell — left rail (persona + views), sticky top bar (rooftop scope), dense content grid. Dealer Principal sees the group umbrella first. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#eef1f6; --line:#dbe1ea; --line2:#c8d0dc;
  --fg:#141b2b; --fg2:#4a5568; --fg3:#7a869a;
  --accent:#0b7f86; --accent-soft:#d8f0f1; --accent2:#3b5bdb; --accent2-soft:#e3e9ff;
  --good:#1f8a4c; --good-soft:#dcf3e5; --warn:#b26a00; --warn-soft:#fff0d6; --bad:#c53030; --bad-soft:#fde2e2;
  --rail:#0f1729; --rail-fg:#c9d3e6; --rail-fg2:#7d8aa5; --rail-on:#1c2a47;
  --display:"Space Grotesk",Inter,system-ui,sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a0f1c; --surface:#111a2e; --surface2:#16213a; --line:#22304d; --line2:#2d3d60;
  --fg:#eaf0fa; --fg2:#a9b4cc; --fg3:#6f7c99;
  --accent:#4fd1c5; --accent-soft:rgba(79,209,197,.14); --accent2:#8aa2ff; --accent2-soft:rgba(124,156,255,.15);
  --good:#68d391; --good-soft:rgba(104,211,145,.14); --warn:#f6ad55; --warn-soft:rgba(246,173,85,.14); --bad:#fc8181; --bad-soft:rgba(252,129,129,.14);
  --rail:#070b15; --rail-fg:#c9d3e6; --rail-fg2:#6f7c99; --rail-on:#16213a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1c; --surface:#111a2e; --surface2:#16213a; --line:#22304d; --line2:#2d3d60;
  --fg:#eaf0fa; --fg2:#a9b4cc; --fg3:#6f7c99;
  --accent:#4fd1c5; --accent-soft:rgba(79,209,197,.14); --accent2:#8aa2ff; --accent2-soft:rgba(124,156,255,.15);
  --good:#68d391; --good-soft:rgba(104,211,145,.14); --warn:#f6ad55; --warn-soft:rgba(246,173,85,.14); --bad:#fc8181; --bad-soft:rgba(252,129,129,.14);
  --rail:#070b15; --rail-fg:#c9d3e6; --rail-fg2:#6f7c99; --rail-on:#16213a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
/* rail */
.rail{background:var(--rail);color:var(--rail-fg);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand .m{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#4fd1c5,#7c9cff);display:grid;place-items:center}
.brand b{font-family:var(--display);font-size:17px;color:#fff;letter-spacing:-.01em}
.brand small{display:block;font-size:10.5px;color:var(--rail-fg2);font-family:var(--mono)}
.rail h6{margin:0 0 6px;padding:0 8px;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--rail-fg2)}
.persona{display:grid;gap:4px}
.persona button,.nav button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:8px;color:var(--rail-fg);display:flex;align-items:center;gap:9px;font-size:13px;width:100%}
.persona button:hover,.nav button:hover{background:var(--rail-on)}
.persona button.on{background:var(--rail-on);color:#fff;box-shadow:inset 2px 0 0 #4fd1c5}
.persona .av{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font:700 10px var(--mono);background:#1c2a47;color:#8fe3db;flex:0 0 22px}
.nav{display:grid;gap:2px}
.nav button.on{background:var(--rail-on);color:#fff}
.nav .ct{margin-left:auto;font:600 10.5px var(--mono);color:#8fe3db}
.nav svg{flex:0 0 16px}
.rail .foot{margin-top:auto;font-size:11px;color:var(--rail-fg2);padding:0 8px;line-height:1.5}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:12px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top h1{margin:0;font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.top .sub{font-size:12px;color:var(--fg3)}
.top .ctl{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select{background:var(--surface);color:var(--fg);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;font:500 13px var(--body)}
.live{display:inline-flex;align-items:center;gap:6px;font:600 11px var(--mono);color:var(--good);background:var(--good-soft);padding:5px 9px;border-radius:999px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.live i{animation:none}}
.content{padding-block:20px 48px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:16px;min-width:0}
.view{display:grid;gap:16px;min-width:0}
.note{font-size:11.5px;color:var(--fg3)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--accent2-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--fg2)}
.banner b{color:var(--fg)}
/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{margin:0;font-size:14px;font-weight:600}
.ph .hint{font-size:12px;color:var(--fg3)}
.ph .r{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.pb{padding:14px 16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-wide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi .l{font-size:11.5px;color:var(--fg3)}
.kpi .v{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--fg2)}
.up{color:var(--good)}.dn{color:var(--bad)}.wn{color:var(--warn)}
/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fg3);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--surface2)}
td .s{display:block;font-size:11.5px;color:var(--fg3)}
td.n,th.n{text-align:right}
.name{font-weight:600}
/* chips */
.tier{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;font:700 12px var(--mono)}
.t1{background:var(--accent-soft);color:var(--accent)}.t2{background:var(--accent2-soft);color:var(--accent2)}.t3{background:var(--warn-soft);color:var(--warn)}.t4{background:var(--surface2);color:var(--fg3)}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--mono);padding:3px 8px;border-radius:6px;white-space:nowrap;background:var(--surface2);color:var(--fg2)}
.c-acc{background:var(--accent-soft);color:var(--accent)}.c-ind{background:var(--accent2-soft);color:var(--accent2)}
.c-good{background:var(--good-soft);color:var(--good)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-bad{background:var(--bad-soft);color:var(--bad)}
.reason{display:inline-block;font-size:11.5px;color:var(--fg2);background:var(--surface2);border-radius:5px;padding:2px 7px;margin:2px 4px 2px 0}
.btn{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:12px;color:var(--fg2)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
/* bars */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:10px;align-items:center;font-size:12.5px}
.bar .t{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar .f{height:100%;background:var(--accent);border-radius:6px}
.bar .f.alt{background:var(--accent2)}
.bar .v{text-align:right;font:600 12px var(--mono)}
.lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* funnel */
.fun{display:grid;gap:6px}
.fun .row{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12.5px}
.fun .t{height:22px;background:var(--surface2);border-radius:5px;overflow:hidden}
.fun .f{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.fun .v{text-align:right;font:600 12px var(--mono)}
/* feed */
.feed{display:grid}
.ev{display:grid;grid-template-columns:58px 30px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev.new{animation:flash 2.4s ease-out}
@keyframes flash{from{background:var(--accent-soft)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.ev.new{animation:none}}
.ev .tm{font:600 12px var(--mono);color:var(--fg2)}
.ev .src{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--surface2);color:var(--fg2)}
.ev .who{font-weight:600}
.ev .meta{font-size:12px;color:var(--fg3)}
.ev .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
/* 360 */
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.hero .av{width:46px;height:46px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font:700 16px var(--display)}
.hero h2{margin:0;font-family:var(--display);font-size:21px;font-weight:600}
.hero .meta{font-size:12.5px;color:var(--fg3)}
.garage{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.car{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:grid;gap:3px;background:var(--surface)}
.car.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.car b{font-size:13px}.car span{font-size:11.5px;color:var(--fg3)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:13px}
.kv span{color:var(--fg3)}.kv b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cbox{border:1px solid var(--line);border-radius:9px;padding:12px}
.cbox h3{margin:0 0 8px;font-size:12px;font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.cbox.inc h3{color:var(--bad)}.cbox.ls{border-color:var(--accent)}.cbox.ls h3{color:var(--accent)}
.formula{font:12px/1.6 var(--mono);background:var(--surface2);border-radius:8px;padding:10px 12px;color:var(--fg2);overflow-x:auto}
.tl{display:grid;gap:0}
.tl .it{display:grid;grid-template-columns:76px 12px minmax(0,1fr);gap:10px;font-size:12.5px;padding:6px 0}
.tl .it .w{color:var(--fg3);font:500 11.5px var(--mono)}
.tl .it .d{width:10px;height:10px;border-radius:50%;background:var(--line2);margin-top:4px}
.tl .it .d.a{background:var(--accent)}.tl .it .d.b{background:var(--accent2)}.tl .it .d.c{background:var(--warn)}
.talk{border-left:3px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0;padding:10px 14px;font-size:13px;color:var(--fg)}
.mpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.gauge{display:grid;gap:4px;font-size:11.5px;color:var(--fg3)}
.gauge .t{height:8px;border-radius:5px;background:var(--surface2);overflow:hidden}
.gauge .f{height:100%;border-radius:5px;background:var(--good)}
/* scan */
.scan{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.phone{border:2px solid var(--line2);border-radius:28px;padding:10px;background:var(--surface2)}
.phone .scr{border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.cam{height:150px;background:#0b1222;position:relative;display:grid;place-items:center}
.cam .frm{width:170px;height:56px;border:2px solid #4fd1c5;border-radius:8px;display:grid;place-items:center}
.cam .bc{width:140px;height:28px;background:repeating-linear-gradient(90deg,#e8eef9 0 2px,transparent 2px 4px,#e8eef9 4px 5px,transparent 5px 8px,#e8eef9 8px 11px,transparent 11px 13px)}
.cam .ln{position:absolute;left:52px;right:52px;top:74px;height:2px;background:#fc8181;box-shadow:0 0 8px #fc8181}
.cam .h{position:absolute;bottom:8px;font:500 10px var(--mono);color:#a9b4cc}
.phone .in{padding:10px;display:grid;gap:8px}
.phone input{width:100%;border:1px solid var(--line2);border-radius:8px;padding:8px 10px;font:500 12.5px var(--mono);background:var(--surface);color:var(--fg)}
/* ask */
.ask textarea{width:100%;min-height:64px;border:1px solid var(--line2);border-radius:9px;padding:10px 12px;font:14px var(--body);background:var(--surface);color:var(--fg);resize:vertical}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sql{font:12px/1.55 var(--mono);background:var(--surface2);border-radius:8px;padding:10px 12px;color:var(--fg2);white-space:pre;overflow-x:auto}
.svgc text{font-family:var(--body)}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:20}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.g-wide{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .persona,.nav{display:flex;overflow-x:auto;gap:4px}
  .persona button,.nav button{width:auto;white-space:nowrap}
  .rail .foot{display:none}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{position:static}
  .g2,.g3,.compare,.scan{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{grid-template-columns:110px minmax(0,1fr) 56px}
  .ev{grid-template-columns:48px minmax(0,1fr);}
  .ev .src{display:none}.ev .act{grid-column:1/-1;justify-content:flex-start}
}
</style>

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=(n,sign)=>n==null?"—":(n<0?"−$":(sign&&n>0?"+$":"$"))+Math.abs(Math.round(n)).toLocaleString("en-US");
const k=n=>"$"+(n/1000).toFixed(1)+"K";
const roof=id=>ROOFS.find(r=>r.id===id);

const disp=d=>`<span class="chip ${DCLS[d]||""}">${esc(d)}</span>`;
const scopeName=()=>state.scope==="ALL"?"All 8 rooftops":roof(state.scope).name;
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2600);}
function save(){try{localStorage.setItem("ls-state",JSON.stringify({persona:state.persona,scope:state.scope}))}catch(e){}}

/* ---------- shell ---------- */
function renderShell(){
  $("#persona").innerHTML=PERSONAS.map(p=>`<button data-p="${p.id}" class="${p.id===state.persona?"on":""}"><span class="av">${p.av}</span>${p.l}</button>`).join("");
  const p=state.persona;
  $("#nav").innerHTML=VIEWS.filter(v=>v.who.includes(p)).map(v=>{
    let ct="";if(v.id==="live-lane")ct=OPPS.filter(inScope).length;if(v.id==="worklist")ct=OPPS.filter(o=>inScope(o)&&o.tier<=2).length;
    return `<button data-v="${v.id}" class="${v.id===state.view?"on":""}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${v.i}</svg>${v.l}${ct?`<span class="ct">${ct}</span>`:""}</button>`}).join("");
  const opts=(p==="dp"?[{id:"ALL",name:"All rooftops (Ortiz Auto Group)"}]:[]).concat(ROOFS.map(r=>({id:r.id,name:r.name+(r.pilot?"  · pilot":"")})));
  $("#roof").innerHTML=opts.map(o=>`<option value="${o.id}" ${o.id===state.scope?"selected":""}>${esc(o.name)}</option>`).join("");
}
function go(v){
  const allowed=VIEWS.filter(x=>x.who.includes(state.persona)).map(x=>x.id);
  if(!allowed.includes(v))v=PERSONAS.find(p=>p.id===state.persona).home;
  state.view=v;renderShell();render();
  try{if(location.protocol!=="about:"&&location.hash!=="#"+v)history.replaceState(null,"","#"+v)}catch(e){}
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-p]");if(b){const p=PERSONAS.find(x=>x.id===b.dataset.p);state.persona=p.id;state.scope=p.scope==="ALL"?"ALL":(state.scope==="ALL"?p.scope:state.scope);save();go(p.home);return;}
  const n=e.target.closest("[data-v]");if(n){go(n.dataset.v);return;}
  const c=e.target.closest("[data-cust]");if(c){state.cust=c.dataset.cust;const o=OPPS.find(x=>x.id===state.cust);if(state.persona==="dp"||state.persona==="porter"){state.persona="spec";}if(o)state.scope=o.roof;save();go("customer");return;}
  const r=e.target.closest("[data-roof]");if(r){state.scope=r.dataset.roof;save();if(state.persona==="dp"){go("leads")}else go(state.view);return;}
  const a=e.target.closest("[data-act]");if(a){act(a.dataset.act,a.dataset.id);}
});
$("#roof").addEventListener("change",e=>{state.scope=e.target.value;save();renderShell();render();});
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==state.view)go(h);});

const TITLES={group:["Group overview","Every rooftop under the Ortiz umbrella, one view"],"live-lane":["Live lane","Arrivals identified as they enter the service drive"],worklist:["Today's worklist","Ranked by tier, then score — work from the top"],customer:["Customer 360","Household, garage, equity and service in one card"],leads:["Leads & dispositions","Every lead, owner and outcome — one pane of glass"],tomorrow:["Tomorrow's prep","Pre-visit outreach for tomorrow's appointments"],benchmark:["Benchmark","LaneSight vs. the incumbent equity tool"],ask:["Ask LaneSight","Plain-language questions over governed data"],sources:["Data sources","Ingestion health across 8 source systems"]};
function render(){
  const [t,s]=TITLES[state.view];$("#vt").textContent=t;$("#vs").textContent=s+" · "+scopeName();
  const fn={group:vGroup,"live-lane":vLane,worklist:vWork,customer:vCust,leads:vLeads,tomorrow:vTom,benchmark:vBench,ask:vAsk,sources:vSrc}[state.view];
  $("#content").innerHTML=`<div class="view">${fn()}</div>`;
  if(state.view==="ask")bindAsk();
}

function roofs(){return state.scope==="ALL"?ROOFS:[roof(state.scope)];}
function sum(f){return roofs().reduce((a,r)=>a+r[f],0)}

function vGroup(){
  const R=roofs(), arr=sum("arr"), t12=sum("t12"), appt=sum("appt"), acq=sum("acq"), sold=sum("sold"), gross=sum("gross"), idle=sum("idle");
  const c60=Math.round(R.reduce((a,r)=>a+r.c60*r.t12,0)/t12);
  const maxG=Math.max(...ROOFS.map(r=>r.gross));
  const rows=[...R].sort((a,b)=>b.gross-a.gross).map(r=>{
    const conv=Math.round((r.acq+r.sold)/r.t12*100);
    const flag=r.c60<60||r.idle>=5?`<span class="chip c-bad">Needs attention</span>`:r.c60>=80?`<span class="chip c-good">On track</span>`:`<span class="chip c-warn">Watch</span>`;
    return `<tr class="click" data-roof="${r.id}"><td><span class="name">${esc(r.name)}</span><span class="s">${r.brand}${r.pilot?" · pilot":" · target state"}${r.cam?" · lane cameras":""}</span></td>
    <td class="n">${r.arr}</td><td class="n">${r.t12}</td><td class="n ${r.c60>=80?"up":r.c60<60?"dn":""}">${r.c60}%</td><td class="n">${r.appt}</td><td class="n">${r.acq}</td><td class="n">${r.sold}</td><td class="n">${conv}%</td><td class="n">${k(r.gross)}</td><td class="n ${r.idle>=5?"dn":""}">${r.idle}</td><td>${flag}</td></tr>`}).join("");
  const bars=[...ROOFS].sort((a,b)=>b.gross-a.gross).map(r=>`<div class="bar"><span class="lbl">${esc(r.short)}</span><div class="t"><div class="f ${r.pilot?"":"alt"}" style="width:${(r.gross/maxG*100).toFixed(1)}%"></div></div><span class="v">${k(r.gross)}</span></div>`).join("");
  const top=OPPS.filter(o=>inScope(o)&&o.tier===1).sort((a,b)=>b.score-a.score).slice(0,6).map(o=>`<tr class="click" data-cust="${o.id}"><td>${tier(o.tier)}</td><td><span class="name">${esc(o.name)}</span><span class="s">${esc(o.veh)}</span></td><td>${esc(roof(o.roof).short)}</td><td>${esc(o.reasons[0])}</td><td>${esc(o.owner)}</td><td>${disp(o.disp)}</td></tr>`).join("");
  const funnel=[["Arrivals",arr],["Tier 1–2 leads",t12],["Contacted",Math.round(t12*c60/100)],["Appointments",appt],["Won MTD",acq+sold]];
  return `
  <div class="banner"><span>ℹ</span><div><b>Dealer Principal view.</b> One umbrella over every rooftop: how many service visits became opportunities, how fast each store responds, and what that is worth. Click a rooftop to drill into its leads. <span class="note">Month to date, Nov 1–10.</span></div></div>
  <div class="kpis">
    <div class="kpi"><span class="l">Service arrivals today</span><span class="v">${arr}</span><span class="d">${R.filter(r=>r.cam).length} rooftop(s) on lane cameras</span></div>
    <div class="kpi"><span class="l">Open Tier 1–2 leads</span><span class="v">${t12}</span><span class="d">${Math.round(t12/arr*100)}% of arrivals</span></div>
    <div class="kpi"><span class="l">Contacted &lt; 60 min</span><span class="v ${c60>=75?"up":"wn"}">${c60}%</span><span class="d">target 90% for Tier 1</span></div>
    <div class="kpi"><span class="l">Acquired MTD</span><span class="v">${acq}</span><span class="d">used units from service</span></div>
    <div class="kpi"><span class="l">Gross from service-to-sales</span><span class="v">${k(gross)}</span><span class="d up">▲ 18% vs Oct same period</span></div>
    <div class="kpi"><span class="l">Leads idle &gt; 24 h</span><span class="v ${idle>10?"dn":""}">${idle}</span><span class="d">auto-escalated to managers</span></div>
  </div>
  <div class="panel"><div class="ph"><h2>Rooftop scorecard</h2><span class="hint">Sorted by gross. Click a row to open that rooftop's leads.</span></div>
   <div class="tw"><table><thead><tr><th>Rooftop</th><th class="n">Arrivals</th><th class="n">T1–2</th><th class="n">&lt;60 min</th><th class="n">Appts</th><th class="n">Acquired</th><th class="n">Sold</th><th class="n">Conv.</th><th class="n">Gross MTD</th><th class="n">Idle</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div></div>
  <div class="grid g-wide">
   <div class="panel"><div class="ph"><h2>Gross from service-to-sales, by rooftop</h2><span class="hint"><span class="chip c-acc">pilot</span> <span class="chip c-ind">target state</span></span></div><div class="pb bars">${bars}</div></div>
   <div class="panel"><div class="ph"><h2>Group funnel</h2><span class="hint">today's leads · wins month to date</span></div><div class="pb fun">${funnel.map(([l,v])=>`<div class="row"><span>${l}</span><div class="t"><div class="f" style="width:${(v/funnel[0][1]*100).toFixed(1)}%"></div></div><span class="v">${v}</span></div>`).join("")}
     <p class="note" style="margin:8px 0 0">${Math.round((acq+sold)/t12*100)}% of Tier 1–2 leads converted. Worst drop-off: contact → appointment.</p></div></div>
  </div>
  <div class="grid g2">
   <div class="panel"><div class="ph"><h2>Top Tier 1 opportunities across the group</h2></div><div class="tw"><table><thead><tr><th></th><th>Customer · vehicle</th><th>Rooftop</th><th>Why</th><th>Owner</th><th>Status</th></tr></thead><tbody>${top||'<tr><td colspan="6" class="note">No Tier 1 opportunities in this scope today.</td></tr>'}</tbody></table></div></div>
   <div class="panel"><div class="ph"><h2>Where the Principal should look</h2></div><div class="pb" style="display:grid;gap:10px">
     <div class="talk" style="border-color:var(--bad);background:var(--bad-soft)"><b>Toyota Westfield:</b> 52% contacted within an hour and 8 idle leads. More arrivals than BMW Ridgeline (66 vs 52) but 37% less gross.</div>
     <div class="talk" style="border-color:var(--warn);background:var(--warn-soft)"><b>Equity data:</b> ${sum("eqFlag")} vehicles where the incumbent tool's equity is off by more than $2,500 from contract math. Desks are quoting from LaneSight figures.</div>
     <div class="talk"><b>BMW Ridgeline:</b> lane cameras alert owners a median of 6 minutes before the RO opens; contact rate 83%. Candidate template for the other rooftops.</div>
   </div></div>
  </div>
  <p class="note">Illustrative figures for a target-state group view. Pilot rooftops are marked; the others show how the same model scales under one umbrella.</p>`;
}

  const ev=OPPS.filter(inScope).sort((a,b)=>tmin(b.arr)-tmin(a.arr));
  const feed=ev.map(o=>evRow(o)).join("");
  const r=state.scope==="ALL"?null:roof(state.scope);
  const counts={camera:0,scan:0,checkin:0};ev.forEach(o=>counts[o.src]++);
  return `
  <div class="grid g-wide">
   <div class="panel"><div class="ph"><h2>Arrivals today</h2><span class="hint">Newest first · ${ev.length} identified</span><div class="r"><span class="chip">${SRC.camera.i} camera ${counts.camera}</span><span class="chip">${SRC.scan.i} scan ${counts.scan}</span><span class="chip">${SRC.checkin.i} check-in ${counts.checkin}</span></div></div>
    <div class="feed" id="feed">${feed}</div></div>
   <div style="display:grid;gap:16px;align-content:start">
    <div class="panel"><div class="ph"><h2>Scan an arrival</h2><span class="hint">Porter / advisor phone</span></div><div class="pb">
     <div class="phone"><div class="scr"><div class="cam"><div class="frm"><div class="bc"></div></div><div class="ln"></div><div class="h">Align door-jamb VIN barcode</div></div>

  const S=[["DMS","CDK","Customers, contracts, ROs, appointments","15 min","2 min ago","ok"],["Service lane","myKaarma","Check-in, inspections, customer-pay","15 min","4 min ago","ok"],["CRM","DriveCentric","Leads, activities, desked deals","15 min","3 min ago","ok"],["Equity tool","automotiveMastermind","Scores, campaigns (benchmark)","Daily","06:10","ok"],["Inventory","VinCue","Inventory, appraisals, market","Daily","05:45","ok"],["Book values","Galves","Trade / wholesale by VIN","Daily","05:30","ok"],["OEM","OEM portal (e.g., Netstar)","Incentives, eligibility, OEM leads","Daily","Phase 2","p2"],["Lender / F&I","Dealertrack","Contract terms, payoff quotes","Daily","05:50","warn"],["Arrival events","Camera partner + mobile scan","Plate / VIN arrivals","Real time","38 s ago","ok"]];
  const st={ok:'<span class="chip c-good">Healthy</span>',warn:'<span class="chip c-warn">1 test failing</span>',p2:'<span class="chip">Phase 2</span>'};
  return `<div class="panel"><div class="ph"><h2>Source systems</h2><span class="hint">Read-only in the pilot · vendors shown are examples of each category</span></div><div class="tw"><table><thead><tr><th>Category</th><th>System</th><th>Data</th><th>Cadence</th><th>Last load</th><th>Status</th></tr></thead><tbody>${S.map(s=>`<tr><td class="name">${s[0]}</td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3]}</td><td>${s[4]}</td><td>${st[s[5]]}</td></tr>`).join("")}</tbody></table></div></div>
  <div class="grid g3">
   <div class="panel"><div class="ph"><h2>Data-quality checks</h2></div><div class="pb kv"><span>Placeholder mileage blocked</span><b>1,284 rows</b><span>Duplicate VINs merged</span><b>37</b><span>Stale payoff (&gt; 30 days)</span><b class="wn">1 failing</b></div></div>
   <div class="panel"><div class="ph"><h2>Identity resolution</h2></div><div class="pb kv"><span>Customers resolved</span><b>48,210</b><span>Households</span><b>31,904</b><span>In review queue</span><b>212</b></div></div>
   <div class="panel"><div class="ph"><h2>Layers</h2></div><div class="pb kv"><span>Landing</span><b>LND_ · 9 sources</b><span>Conformed</span><b>CNF_ · 9 entities</b><span>Refined</span><b>REF_ · 4 marts</b></div></div>
  </div>`;
}

/* ---------- actions ---------- */
let scanN=0;
function act(a,id){
  if(a==="lf"){state.leadFilter=id;render();return;}
  if(a==="crm"){toast("Opens the customer's record in the CRM (DriveCentric in this pilot).");return;}
  if(a==="log"){const o=OPPS.find(x=>x.id===id);const i=DISP.indexOf(o.disp);o.disp=DISP[Math.min(i+1,4)];o.last="Logged · just now";o.idle=0;toast(`Outcome logged: ${o.disp}. Synced to the manager view.`);render();return;}
  if(a==="ask"){const i=id==="run"?Math.max(0,QA.findIndex(x=>x.q===$("#askq").value.trim())):Number(id);if(id!=="run")$("#askq").value=QA[i].q;showAns(i);return;}
  if(a==="scan"){
    const vin=($("#vin").value||"").trim().toUpperCase();
    if(!/^[A-HJ-NPR-Z0-9]{17}$/.test(vin)){toast("That isn't a valid 17-character VIN. Rescan or type it.");return;}
    scanN++;const now=new Date();const t=`${((now.getHours()+11)%12)+1}:${String(now.getMinutes()).padStart(2,"0")}`;
    const r=state.scope==="ALL"?"R1":state.scope;
    const o={id:"s"+scanN,name:scanN===1?"Victor Lindqvist (repeat visit)":"New customer · review",veh:scanN===1?"2021 BMW 5 Series 540i xDrive":"Vehicle from VIN "+vin.slice(-6),mi:50115,roof:r,tier:scanN===1?2:3,score:scanN===1?70:45,reasons:scanN===1?["Matches used-inventory gap","+$6.2K equity"]:["Unknown vehicle · sent to review"],owner:OWNERS[r][0],src:"scan",arr:t,status:"Arrived",insp:"Not started",lsEq:scanN===1?6240:null,incEq:null,disp:"New",last:"None",idle:0,deal:"Finance"};
    OPPS.push(o);toast(o.tier<=2?`Identified in 1.4 s · Tier ${o.tier} · ${o.owner} alerted`:"No match · created a review record");
    renderShell();const f=$("#feed");if(f)f.insertAdjacentHTML("afterbegin",evRow(o,true));
  }
}

/* ---------- boot ---------- */
let h="";try{h=location.hash.slice(1)}catch(e){}
renderShell();go(h||PERSONAS.find(p=>p.id===state.persona).home);
})();
</script>
